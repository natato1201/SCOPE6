<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ホログラム</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ホログラム">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#fff; --ink:#111; --sub:#777; --line:#ddd; --red:#d92d20;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#000; --ink:#eee; --sub:#888; --line:#333; } }
:root[data-theme="dark"]{ --bg:#000; --ink:#eee; --sub:#888; --line:#333; }
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; font-size:16px; line-height:1.5;
  -webkit-tap-highlight-color:transparent}
button, input{font:inherit; color:inherit}
button{background:none; border:1px solid var(--line); border-radius:6px; padding:12px; cursor:pointer}
button.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
button:disabled{opacity:.4}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.hidden{display:none !important}
.wrap{max-width:480px; margin:0 auto; padding:20px 16px}
h1{font-size:1.2rem; margin:0 0 20px}
.msg{color:var(--sub); font-size:.9rem; min-height:1.5em; margin-top:10px}

/* ---------- 最初の画面 ---------- */
#start{position:fixed; inset:0; z-index:5; background:#000; color:#f2f4f6; overflow:hidden;
  display:flex; flex-direction:column; padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#hero{position:relative; flex:1; min-height:0}
#heroCv{position:absolute; inset:0; width:100%; height:100%}
#start .title{position:absolute; left:0; right:0; bottom:4%; text-align:center; pointer-events:none}
#start .title h1{font-family:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif; font-weight:400;
  font-size:clamp(2.1rem, 11vw, 3.4rem); letter-spacing:.32em; margin:0 0 0 .32em; line-height:1.2}
#start .title h1 span{display:inline-block}
#start .title p{margin:.7em 0 0; font-size:.8rem; letter-spacing:.3em; color:rgba(230,240,245,.5)}
#choose{padding:8px 24px 28px; max-width:460px; width:100%; margin:0 auto}
.pick{position:relative; display:flex; align-items:baseline; justify-content:space-between; width:100%;
  background:transparent; color:#f2f4f6; border:0; border-top:1px solid rgba(255,255,255,.18); border-radius:0;
  padding:20px 4px; text-align:left; overflow:hidden; transition:color .3s}
.pick:last-of-type{border-bottom:1px solid rgba(255,255,255,.18)}
.pick b{font-family:"Zen Old Mincho","Hiragino Mincho ProN",serif; font-weight:400; font-size:1.35rem; letter-spacing:.18em}
.pick small{font-size:.78rem; color:rgba(230,240,245,.5); letter-spacing:.08em; transition:color .3s, transform .4s}
.pick::before{content:""; position:absolute; left:0; top:0; bottom:0; width:100%;
  background:linear-gradient(90deg, rgba(120,220,255,0), rgba(120,220,255,.14) 60%, rgba(255,255,255,.22));
  transform:translateX(-101%); transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.pick:hover::before, .pick:focus-visible::before, .pick:active::before{transform:translateX(0)}
.pick:hover small, .pick:focus-visible small{color:#dff6ff; transform:translateX(-6px)}
.pick:disabled{opacity:.35}
.pick:focus-visible{outline:1px solid rgba(255,255,255,.6); outline-offset:-1px}
.credit{display:flex; align-items:center; justify-content:center; gap:12px; margin-top:22px; color:rgba(230,240,245,.62)}
.credit img{width:46px; height:46px; border-radius:50%; flex:none}
.credit span{display:block; font-size:.72rem; letter-spacing:.12em; line-height:1.5}
.credit b{display:block; font-family:"Zen Old Mincho","Hiragino Mincho ProN",serif; font-weight:400; font-size:1rem; letter-spacing:.36em; color:rgba(240,248,252,.85)}
#startMsg{color:rgba(255,190,170,.9); text-align:center; min-height:1.5em; margin-top:10px; font-size:.85rem}
@media (prefers-reduced-motion:no-preference){
  #start .title h1 span{opacity:0; filter:blur(10px); transform:translateY(.3em);
    animation:glyph 1.4s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(1.1s + var(--i) * .12s)}
  #start .title p{opacity:0; animation:fade 1.2s ease forwards 2.1s}
  .pick{opacity:0; transform:translateY(14px); animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
  .pick:nth-of-type(1){animation-delay:2.2s} .pick:nth-of-type(2){animation-delay:2.35s}
  .credit{opacity:0; animation:fade 1.4s ease forwards 2.7s}
}
@keyframes glyph{to{opacity:1; filter:blur(0); transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes rise{to{opacity:1; transform:none}}

/* 再生用 */
#display{position:fixed; inset:0; background:#000; z-index:10; overflow:hidden}
#stage{position:absolute; inset:0}
#vid, #photo img{position:absolute; display:block; transform-origin:50% 50%; visibility:hidden}
#vid{object-fit:fill}
#back{position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); left:12px; z-index:2;
  border-color:#444; color:#ccc; background:#000; padding:8px 14px}
#setup{position:absolute; inset:0; z-index:3; background:#000; display:flex; flex-direction:column; justify-content:center; gap:10px; padding:24px; max-width:420px; margin:0 auto}
#setup button{border-color:#444; color:#eee}
#setup .msg{color:#777}

/* リモコン */
#remote{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px}
.head h1{margin:0}
.head span{font-size:.85rem; color:var(--sub)}
.head button{padding:6px 12px; font-size:.85rem; margin-left:6px}
.item{display:flex; gap:6px; margin-bottom:6px}
.item .play{flex:1; min-width:0; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item .cfg{flex:none; width:5em; font-size:.85rem; padding:12px 0}
#add{width:100%; border-style:dashed; color:var(--sub); margin-top:6px}
.panel{border:1px solid var(--line); border-radius:6px; padding:12px; margin:0 0 10px}
.panel label{display:block; font-size:.85rem; color:var(--sub); margin-bottom:4px}
#name{width:100%; border:1px solid var(--line); border-radius:6px; padding:10px; background:transparent; margin-bottom:12px}
#pad{display:block; margin:0 auto; background:#000; border-radius:4px; touch-action:none; cursor:grab}
.tools{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.tools button{padding:8px 12px; font-size:.9rem}
.tools .sp{flex:1}
.tools span{align-self:center; font-size:.85rem; color:var(--sub); min-width:3.5em}
.hint{font-size:.8rem; color:var(--sub); margin-top:8px}
#stop{position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); max-width:448px; margin:0 auto;
  background:var(--red); color:#fff; border:0; border-radius:10px; padding:16px; font-size:1.1rem; font-weight:700}
</style>
</head>
<body>

<div id="start">
  <div id="hero">
    <canvas id="heroCv" aria-hidden="true"></canvas>
    <div class="title">
      <h1 aria-label="ホログラム"><span style="--i:0">ホ</span><span style="--i:1">ロ</span><span style="--i:2">グ</span><span style="--i:3">ラ</span><span style="--i:4">ム</span></h1>
      <p>光で浮かぶ、ちいさな立体</p>
    </div>
  </div>
  <div id="choose">
    <button class="pick" id="bDisplay"><b>再生用</b><small>プラ板をのせるスマホ</small></button>
    <button class="pick" id="bRemote"><b>リモコン</b><small>手元で操作する端末</small></button>

<script>
/* 最初の画面のアニメーション: ゆっくり回るピラミッドと、その中に浮かぶ光 */
(() => {
  const cv = document.getElementById("heroCv"), ctx = cv.getContext("2d"), start = document.getElementById("start");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, dpr = 1, raf = 0, t0 = performance.now();
  const dots = Array.from({length:70}, () => ({x:Math.random()*2-1, y:Math.random(), z:Math.random()*2-1, s:Math.random()*.6+.2, p:Math.random()*6.28}));
  function size(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W*dpr; cv.height = H*dpr;
  }
  addEventListener("resize", size);
  // ピラミッド(先が下の四角すい台)
  const TOP = 1.25, BOT = .16, YT = -.95, YB = .72;
  const V = [];
  for (const [y, r] of [[YT, TOP], [YB, BOT]]) for (const [a, b] of [[-1,-1],[1,-1],[1,1],[-1,1]]) V.push([a*r, y, b*r]);
  const E = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  const F = [[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]];
  function frame(now){
    const t = (now - t0)/1000, intro = still ? 1 : Math.min(1, t/1.8), ease = 1 - Math.pow(1 - intro, 3);
    const S = Math.min(W*.27, H*.22), cx = W/2, cy = H*.44;
    const ry = still ? .55 : t*.28 + .55, rx = -.32;
    const cy_ = Math.cos(ry), sy = Math.sin(ry), cx_ = Math.cos(rx), sx = Math.sin(rx);
    const P = ([x, y, z]) => {
      const X = x*cy_ - z*sy, Z0 = x*sy + z*cy_;
      const Y = y*cx_ - Z0*sx, Z = y*sx + Z0*cx_;
      const k = 7/(7 + Z);
      return [cx + X*S*k, cy + Y*S*k, Z];
    };
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0, 0, W, H);

    // 足もとのスマホ画面の光
    const g0 = ctx.createRadialGradient(cx, cy + YB*S + 8, 0, cx, cy + YB*S + 8, S*1.1);
    g0.addColorStop(0, `rgba(120,215,255,${.22*ease})`); g0.addColorStop(1, "rgba(120,215,255,0)");
    ctx.fillStyle = g0; ctx.fillRect(0, 0, W, H);

    // ただよう粒
    for (const d of dots) {
      const y = ((d.y - t*.03*d.s) % 1 + 1) % 1;
      const [px, py, pz] = P([d.x*1.6, 1.2 - y*2.6, d.z*1.6]);
      const a = (.25 + .35*Math.sin(t*1.7 + d.p)) * ease * (1 - Math.abs(y - .5)*1.6);
      if (a <= 0) continue;
      ctx.fillStyle = `rgba(210,240,255,${a})`;
      ctx.beginPath(); ctx.arc(px, py, (pz < 0 ? 1.3 : .8)*d.s + .3, 0, 6.3); ctx.fill();
    }

    // 面(うすいガラス)
    const pv = V.map(P);
    F.map(f => ({f, z:f.reduce((a, i) => a + pv[i][2], 0)/4})).sort((a, b) => b.z - a.z).forEach(({f, z}) => {
      const gr = ctx.createLinearGradient(pv[f[0]][0], pv[f[0]][1], pv[f[2]][0], pv[f[2]][1]);
      const sheen = .5 + .5*Math.sin(ry*2 + f[0]);
      gr.addColorStop(0, `rgba(255,255,255,${(.02 + .07*sheen)*ease})`);
      gr.addColorStop(1, `rgba(140,220,255,${.015*ease})`);
      ctx.fillStyle = gr; ctx.beginPath();
      f.forEach((i, n) => n ? ctx.lineTo(pv[i][0], pv[i][1]) : ctx.moveTo(pv[i][0], pv[i][1]));
      ctx.closePath(); ctx.fill();
    });

    // 中に浮かぶ光(ホログラム)
    const bob = Math.sin(t*1.1)*.05, [ox, oy] = P([0, -.12 + bob, 0]), r = S*.3*ease;
    if (r > 0) {
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      const g1 = ctx.createRadialGradient(ox, oy, 0, ox, oy, r*2.4);
      g1.addColorStop(0, "rgba(160,235,255,.55)"); g1.addColorStop(.35, "rgba(90,190,255,.18)"); g1.addColorStop(1, "rgba(90,190,255,0)");
      ctx.fillStyle = g1; ctx.beginPath(); ctx.arc(ox, oy, r*2.4, 0, 6.3); ctx.fill();
      // 回る輪
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.ellipse(ox, oy, r*(1.05 + k*.28), r*(.22 + .12*Math.sin(t*.9 + k*2)), Math.sin(t*.4 + k)*.5 + k*1.05, 0, 6.3);
        ctx.strokeStyle = `rgba(200,245,255,${.28 - k*.07})`; ctx.lineWidth = 1; ctx.stroke();
      }
      // 走査線
      ctx.beginPath(); ctx.arc(ox, oy, r*.62, 0, 6.3); ctx.clip();
      for (let yy = -r; yy < r; yy += 3) {
        const a = .12 + .1*Math.sin(yy*.35 - t*9);
        ctx.fillStyle = `rgba(230,250,255,${a})`; ctx.fillRect(ox - r, oy + yy, r*2, 1);
      }
      ctx.restore();
    }

    // 辺(線が描かれていく)
    ctx.lineCap = "round";
    E.forEach(([a, b], n) => {
      const local = Math.max(0, Math.min(1, ease*1.6 - n*.05));
      if (!local) return;
      const A = pv[a], B = pv[b], front = (A[2] + B[2]) < 0;
      ctx.strokeStyle = `rgba(235,248,255,${front ? .85 : .3})`; ctx.lineWidth = front ? 1.2 : .8;
      ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(A[0] + (B[0]-A[0])*local, A[1] + (B[1]-A[1])*local); ctx.stroke();
    });

    if (!still) raf = requestAnimationFrame(frame);
  }
  function run(){ cancelAnimationFrame(raf); size(); raf = requestAnimationFrame(frame); }
  // 最初の画面が見えている間だけ動かす
  new MutationObserver(() => { start.classList.contains("hidden") ? cancelAnimationFrame(raf) : run(); })
    .observe(start, {attributes:true, attributeFilter:["class"]});
  run();
})();
</script>

const ROOM = "holo-q7x2m9k4t8";   // 部屋名(固定)。リモコンだけがこの名前を使い、1台に限られる
const ICE = {config:{iceServers:[{urls:"stun:stun.l.google.com:19302"}]}};
const DEF = {scale:1, x:0, y:0, rot:0, gap:0.02};
const def = s => Object.assign({}, DEF, s || {});
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

// 端末内の保存場所(IndexedDB)
function makeIdb(dbName){
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open(dbName, 1);
    r.onupgradeneeded = () => r.result.createObjectStore("media", {keyPath:"id"});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("media", mode), out = fn(t.objectStore("media"));
      t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
    });
  };

    all: () => tx("readonly", s => s.getAll()),
    get: id => tx("readonly", s => s.get(id)),

const mediaSize = (blob, photo) => new Promise(res => {

  v.onloadedmetadata = () => done(v.videoWidth || 16, v.videoHeight || 9, false);

let peer = null, role = null, timers = [];

/* ---------- start ---------- */
function enter(r){
  if (typeof Peer === "undefined") { $("startMsg").textContent = "ネットにつながっていません"; return; }
  $("bDisplay").disabled = $("bRemote").disabled = true;
  $("startMsg").textContent = "";
  let ok = false;
  // リモコンは固定の名前(1台だけ)、再生用は毎回ちがう名前(何台でも)
  const p = r === "remote" ? new Peer(ROOM + "-remote", ICE) : new Peer(ICE);
  p.on("open", () => {
    ok = true; peer = p; role = r;
    $("bDisplay").disabled = $("bRemote").disabled = false;
    $("start").classList.add("hidden");
    r === "display" ? startDisplay() : startRemote();
  });
  p.on("error", e => {
    if (ok) return;
    $("bDisplay").disabled = $("bRemote").disabled = false; p.destroy();
    $("startMsg").textContent = e.type === "unavailable-id" ? "リモコンはもう別の端末が使っています" : "接続できませんでした";
  });
  p.on("disconnected", () => { if (peer === p) setTimeout(() => { try { p.reconnect(); } catch(e){} }, 1500); });
}
$("bDisplay").onclick = () => enter("display");
$("bRemote").onclick = () => enter("remote");

function leave(){
  timers.forEach(clearInterval); timers = [];

  if (peer) peer.destroy();
  peer = null; role = null;
  $("display").classList.add("hidden"); $("remote").classList.add("hidden");
  $("start").classList.remove("hidden");
}

/* ================= 再生用(何台でも) ================= */
const dIdb = makeIdb("holo-display");
const vid = $("vid"), imgs = [...document.querySelectorAll("#photo img")];
let dConn = null, dPending = null, files = new Map();   // id -> {id, photo, url, w, h, bad}
let dSettings = {}, dState = {id:null, playing:false}, running = false, curVid = null, lock = null, incoming = null, unlocked = false;

async function startDisplay(){
  $("display").classList.remove("hidden"); $("setup").classList.remove("hidden");
  for (const f of files.values()) URL.revokeObjectURL(f.url);
  files.clear();
  try { for (const rec of await dIdb.all()) await addFile(rec); } catch(e){}
  dStatus(); dConnect(); timers.push(setInterval(dConnect, 3000));
}
function stopDisplay(){
  running = false; vid.pause(); vid.removeAttribute("src"); vid.load(); curVid = null;
  if (dConn) try { dConn.close(); } catch(e){}
  dConn = null;
  try { document.fullscreenElement && document.exitFullscreen(); } catch(e){}
  try { lock && lock.release(); } catch(e){} lock = null;
}
function dStatus(){
  const on = dConn && dConn.open;
  $("dStatus").textContent = (on ? "リモコンと接続中" : "リモコンを待っています") + `　保存済み ${files.size}件`;
}
async function addFile(rec){
  const old = files.get(rec.id); if (old) URL.revokeObjectURL(old.url);
  const size = await mediaSize(rec.blob, rec.photo);
  files.set(rec.id, {id:rec.id, photo:rec.photo, url:URL.createObjectURL(rec.blob), w:size.w, h:size.h, bad:size.bad});
  if (curVid === rec.id) curVid = null;
}
async function dropFile(id){
  const f = files.get(id); if (f) URL.revokeObjectURL(f.url);
  files.delete(id); try { await dIdb.del(id); } catch(e){}
  if (curVid === id) { vid.pause(); curVid = null; }
}
// 再生用からリモコンにつなぎにいく(リモコンがあとから来ても、再生用が途中から入ってもつながる)
function dConnect(){
  if (!peer || peer.disconnected || (dConn && dConn.open)) return;
  if (dPending) try { dPending.close(); } catch(e){}
  const c = dPending = peer.connect(ROOM + "-remote", {reliable:true});
  c.on("open", () => {
    dPending = null; dConn = c; dStatus();
    c.send({t:"hello", have:[...files.keys()], screen:{w:innerWidth, h:innerHeight}});
  });
  c.on("data", onDisplayData);
  c.on("close", () => { if (dConn === c) { dConn = null; dStatus(); } });
  c.on("error", () => {});
}
async function onDisplayData(m){
  if (!m) return;
  if (m.t === "sync") {             // つないだ直後: 一覧・設定・いま再生中のもの
    const keep = new Set(m.ids || []);
    for (const id of [...files.keys()]) if (!keep.has(id)) await dropFile(id);
    dSettings = m.settings || {}; dState = m.state || {id:null, playing:false};
    dStatus(); apply(true);
  }
  if (m.t === "play") { dState = {id:m.id, playing:true}; apply(true); }
  if (m.t === "stop") { dState = {id:null, playing:false}; apply(); }
  if (m.t === "set") { dSettings[m.id] = def(m.s); layout(); }
  if (m.t === "del") { await dropFile(m.id); dStatus(); apply(); }
  if (m.t === "begin") incoming = {id:String(m.id), type:String(m.type), photo:!!m.photo, parts:[]};
  if (m.t === "chunk" && incoming) incoming.parts.push(m.data);
  if (m.t === "end" && incoming) {
    const rec = {id:incoming.id, photo:incoming.photo, blob:new Blob(incoming.parts, {type:incoming.type})};
    incoming = null;
    let ok = true;
    try { await dIdb.put(rec); } catch(e){ ok = false; }
    await addFile(rec);
    if (dConn) dConn.send({t:"saved", id:rec.id, ok, bad:files.get(rec.id).bad});

  }
}
function goFull(){
  const el = document.documentElement;

  const fn = el.requestFullscreen || el.webkitRequestFullscreen;

}

  if (first && !unlocked) {
    curVid = first.id; vid.src = first.url;
    const p = vid.play();
    if (p) p.then(() => { unlocked = true; apply(); }).catch(() => {});
  }
  $("setup").classList.add("hidden"); running = true; goFull();
  try { lock = await navigator.wakeLock.request("screen"); } catch(e){}

};
$("setupBack").onclick = leave;
let backTimer = 0;
$("stage").addEventListener("click", () => {
  goFull();
  $("back").classList.remove("hidden");

});
$("back").onclick = () => {
  $("back").classList.add("hidden");

const curFile = () => (running && dState.playing) ? files.get(dState.id) || null : null;
function apply(restart){
  const f = curFile();
  if (!f || f.photo) { if (unlocked || !running) vid.pause(); layout(); return; }
  if (curVid !== f.id) { curVid = f.id; vid.src = f.url; }

function layout(){
  const W = innerWidth, H = innerHeight, m = Math.min(W, H), f = curFile();
  vid.style.visibility = (f && !f.photo) ? "visible" : "hidden";
  imgs.forEach(im => im.style.visibility = (f && f.photo) ? "visible" : "hidden");
  if (!f) return;
  const s = def(dSettings[f.id]), cx = W/2 + s.x*m, cy = H/2 + s.y*m;
  if (f.photo) {
    // 写真1枚を4つ、上辺が外側を向くように並べる(反射で正しい向きになるよう左右反転)
    const k = Math.min(m*.28*s.scale/f.w, m*.28*s.scale/f.h), w = f.w*k, h = f.h*k, d = w/2 + s.gap*m + h/2;
    imgs.forEach((im, i) => {
      if (im.getAttribute("src") !== f.url) im.src = f.url;
      Object.assign(im.style, {width:w+"px", height:h+"px", left:(cx - w/2)+"px", top:(cy - h/2)+"px",
        transform:`rotate(${i*90 + s.rot}deg) translateY(${-d}px) scaleX(-1)`});
    });
    return;
  }
  const vw = vid.videoWidth || f.w, vh = vid.videoHeight || f.h;
  const k = Math.min(m*s.scale/vw, m*s.scale/vh), w = vw*k, h = vh*k;
  Object.assign(vid.style, {width:w+"px", height:h+"px", left:(cx - w/2)+"px", top:(cy - h/2)+"px", transform:`rotate(${s.rot}deg)`});
}

async function startRemote(){
  $("remote").classList.remove("hidden"); $("sendMsg").textContent = ""; openId = null;
  try { items = (await rIdb.all()).map(({blob, ...meta}) => meta).sort((a, b) => a.order - b.order); } catch(e){ items = []; }
  render();
  peer.on("connection", c => {
    c.q = Promise.resolve();

const acks = new Map();   // "connId:itemId" -> resolve
function onRemoteData(c, m){
  if (!m) return;
  if (m.t === "hello") {
    if (m.screen) screen = {w:+m.screen.w || 390, h:+m.screen.h || 844};
    const have = new Set(m.have || []);
    c.send({t:"sync", ids:items.map(i => i.id), settings, state});
    for (const it of items) if (!have.has(it.id)) queueSend(c, it);
    render();
  }
  if (m.t === "screen" && m.screen) { screen = {w:+m.screen.w || 390, h:+m.screen.h || 844}; if (openId) sizePad(); }
  if (m.t === "saved") {
    if (m.bad) badIds.add(m.id);
    const k = c.connectionId + ":" + m.id, r = acks.get(k);
    if (r) { acks.delete(k); r(m.ok); }

// 1台の再生用へ、1件ずつ順番に送る
function queueSend(c, it){
  c.q = c.q.then(async () => {
    if (!c.open) return;
    const rec = await rIdb.get(it.id); if (!rec) return;
    const buf = await rec.blob.arrayBuffer(), CH = 64*1024;
    c.send({t:"begin", id:it.id, type:rec.type, photo:rec.photo});
    for (let i = 0; i < buf.byteLength; i += CH) {
      if (!c.open) return;
      while (c.dataChannel && c.dataChannel.bufferedAmount > 1024*1024) await new Promise(r => setTimeout(r, 30));
      c.send({t:"chunk", data:buf.slice(i, i + CH)});
      progress(it, Math.round(Math.min(100, (i + CH) / buf.byteLength * 100)));
    }
    const ok = await new Promise(r => {
      acks.set(c.connectionId + ":" + it.id, r);
      setTimeout(() => { if (acks.delete(c.connectionId + ":" + it.id)) r(false); }, 60000);
      c.send({t:"end"});
    });
    progress(it, ok ? "done" : "fail");
  }).catch(() => {});
}
let sendingCount = 0;
function progress(it, p){
  if (p === "done" || p === "fail") {
    $("sendMsg").textContent = p === "fail" ? `「${it.name}」を送れませんでした`
      : badIds.has(it.id) ? `「${it.name}」は再生用の端末で再生できない形式です(mp4で入れ直してください)` : `「${it.name}」を再生用に送りました`;
    render(); return;
  }
  $("sendMsg").textContent = `再生用へ送信中「${it.name}」${p}%`;
}

function setState(s){ state = s; store.set("holo-r-state", state); render(); }
function play(id){ setState({id, playing:true}); bcast({t:"play", id}); }

function render(){

  L.textContent = "";

    const row = document.createElement("div"); row.className = "item";
    const b = document.createElement("button"); b.className = "play";
    const playing = state.playing && state.id === it.id;
    b.textContent = (playing ? "▶ " : "") + it.name + (badIds.has(it.id) ? "(再生できない形式)" : "");
    b.classList.toggle("on", playing);

    const c = document.createElement("button"); c.className = "cfg";
    c.textContent = openId === it.id ? "閉じる" : "設定";
    c.onclick = () => { openId = openId === it.id ? null : it.id; if (openId) play(it.id); else render(); };
    row.append(b, c); L.appendChild(row);
    if (openId === it.id) {
      L.appendChild($("panel")); $("panel").classList.remove("hidden");
      if (document.activeElement !== $("name")) $("name").value = it.name;

/* 追加: リモコンに保存してから、つながっている再生用すべてへ送る */

const pad = $("pad"), pc = pad.getContext("2d");

  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const p = [...pts.values()], M = Math.min(pw, ph), s = Object.assign({}, g.s);
  if (p.length === 1) {
    s.x = clamp(g.s.x + (p[0].x - g.p[0].x)/M, -.7, .7);
    s.y = clamp(g.s.y + (p[0].y - g.p[0].y)/M, -.7, .7);
  } else {
    const d = Math.hypot(p[1].x-p[0].x, p[1].y-p[0].y), mid = {x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2};
    s.scale = clamp(g.s.scale * d/g.d, .15, 3);
    const a = Math.atan2(p[1].y-p[0].y, p[1].x-p[0].x);
    s.rot = snap(norm(g.s.rot + (a - g.a)*180/Math.PI));
    s.x = clamp(g.s.x + (mid.x - g.m.x)/M, -.7, .7);
    s.y = clamp(g.s.y + (mid.y - g.m.y)/M, -.7, .7);
  }
  update(s);
});
const end = e => { pts.delete(e.pointerId); pts.size ? begin() : (g = null); };
pad.addEventListener("pointerup", end);
pad.addEventListener("pointercancel", end);
})();
