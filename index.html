<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ホログラム</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ホログラム">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#fff; --ink:#111; --sub:#777; --line:#ddd; --red:#d92d20;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#000; --ink:#eee; --sub:#888; --line:#333; } }
:root[data-theme="dark"]{ --bg:#000; --ink:#eee; --sub:#888; --line:#333; }
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; font-size:16px; line-height:1.5;
  -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; background:none; border:1px solid var(--line); border-radius:6px; padding:12px; cursor:pointer}
button.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
button:disabled{opacity:.4}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.hidden{display:none !important}
.wrap{max-width:480px; margin:0 auto; padding:20px 16px}
h1{font-size:1.2rem; margin:0 0 20px}
.msg{color:var(--sub); font-size:.9rem; min-height:1.5em; margin-top:10px}

#start button{display:block; width:100%; margin-bottom:10px; text-align:left}

/* 再生用 */
#display{position:fixed; inset:0; background:#000; z-index:10}
#cv{position:absolute; inset:0; width:100%; height:100%}
#vid{position:absolute; width:2px; height:2px; opacity:0; pointer-events:none}
#exit{position:absolute; top:0; left:0; width:70px; height:70px; border:0}
#setup{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; gap:10px; padding:24px; max-width:420px; margin:0 auto}
#setup button{border-color:#444; color:#eee}
#setup .msg{color:#777}

/* リモコン */
#remote{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px}
.head h1{margin:0}
.head span{font-size:.85rem; color:var(--sub)}
.item{display:flex; gap:6px; margin-bottom:6px}
.item .play{flex:1; min-width:0; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item .cfg{flex:none; width:5em; font-size:.85rem; padding:12px 0}
#add{width:100%; border-style:dashed; color:var(--sub); margin-top:6px}
.panel{border:1px solid var(--line); border-radius:6px; padding:12px; margin:0 0 10px}
#pad{display:block; margin:0 auto; background:#000; border-radius:4px; touch-action:none; cursor:grab}
.tools{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.tools button{padding:8px 12px; font-size:.9rem}
.tools .sp{flex:1}
.tools span{align-self:center; font-size:.85rem; color:var(--sub); min-width:3.5em}
.hint{font-size:.8rem; color:var(--sub); margin-top:8px}
#stop{position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); max-width:448px; margin:0 auto;
  background:var(--red); color:#fff; border:0; border-radius:10px; padding:16px; font-size:1.1rem; font-weight:700}
</style>
</head>
<body>

<div id="start" class="wrap">
  <h1>ホログラム</h1>
  <button id="bDisplay">再生用</button>
  <button id="bRemote">リモコン</button>
  <div class="msg" id="startMsg"></div>
</div>

<div id="display" class="hidden">
  <canvas id="cv"></canvas>
  <video id="vid" muted playsinline loop preload="auto"></video>
  <button id="exit" aria-label="戻る"></button>
  <div id="setup">
    <button id="go">開始</button>
    <div class="msg" id="saved"></div>
  </div>
</div>

<div id="remote" class="wrap hidden">
  <div class="head"><h1>リモコン</h1><span id="link">未接続</span></div>
  <div id="list"></div>
  <input type="file" id="files" accept="video/*,image/*" multiple class="hidden">
  <button id="add">＋ 追加</button>
  <div class="msg" id="sendMsg"></div>
  <button id="stop">停止</button>
</div>

<!-- 設定パネル(開いた項目の下に差し込む) -->
<div id="panel" class="panel hidden">
  <canvas id="pad"></canvas>
  <div class="tools">
    <button id="zOut" aria-label="小さく">－</button>
    <span id="size"></span>
    <button id="zIn" aria-label="大きく">＋</button>
    <button id="gIn" class="photo">間隔 −</button>
    <button id="gOut" class="photo">間隔 ＋</button>
    <span class="sp"></span>
    <button id="reset">リセット</button>
    <button id="del">削除</button>
  </div>
  <div class="hint">ドラッグで移動。スマホは2本指、パソコンはホイールでも大きさを変えられます。</div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const ROOM = "holo-q7x2m9k4t8";   // 部屋名(固定)
const ICE = {config:{iceServers:[{urls:"stun:stun.l.google.com:19302"}]}};
const DEF = {scale:1, x:0, y:0, gap:0.02};
const def = s => Object.assign({}, DEF, s || {});
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

let peer = null, conn = null, role = null;
let settings = store.get("holo-settings", {});
let state = {name:null, playing:false};
let list = [], screen = {w:390, h:844};
const send = m => { if (conn && conn.open) try { conn.send(m); } catch(e){} };

/* ---------- 再生用スマホの保存場所(IndexedDB) ---------- */
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("holo", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("media", {keyPath:"name"});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("media", mode), out = fn(t.objectStore("media"));
      t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
    });
  };
  return {
    all: () => tx("readonly", s => s.getAll()),
    put: rec => tx("readwrite", s => s.put(rec)),
    del: name => tx("readwrite", s => s.delete(name))
  };
})();

/* ---------- start ---------- */
function enter(r){
  if (typeof Peer === "undefined") { $("startMsg").textContent = "ネットにつながっていません"; return; }
  $("bDisplay").disabled = $("bRemote").disabled = true;
  $("startMsg").textContent = "";
  let ok = false;
  const p = new Peer(ROOM + "-" + r, ICE);
  p.on("open", () => {
    ok = true; peer = p; role = r;
    $("bDisplay").disabled = $("bRemote").disabled = false;
    $("start").classList.add("hidden");
    r === "display" ? startDisplay() : startRemote();
  });
  p.on("error", e => {
    if (ok) return;
    $("bDisplay").disabled = $("bRemote").disabled = false; p.destroy();
    $("startMsg").textContent = e.type === "unavailable-id" ? "使用中です" : "接続できませんでした";
  });
  p.on("disconnected", () => { if (peer === p) setTimeout(() => { try { p.reconnect(); } catch(e){} }, 1500); });
}
$("bDisplay").onclick = () => enter("display");
$("bRemote").onclick = () => enter("remote");
addEventListener("pagehide", () => peer && peer.destroy());

/* ================= 再生用 ================= */
const cv = $("cv"), ctx = cv.getContext("2d"), vid = $("vid");
let files = [], running = false, cur = null, lock = null, incoming = null;

async function startDisplay(){
  $("display").classList.remove("hidden");
  try { for (const rec of await idb.all()) await addMedia(rec); } catch(e){}
  showSaved();
  peer.on("connection", c => {
    if (c.peer !== ROOM + "-remote") return c.close();
    if (conn && conn !== c) conn.close();
    conn = c;
    c.on("open", sendList);
    c.on("data", onData);
    c.on("close", () => { if (conn === c) conn = null; });
  });
}
function showSaved(){ $("saved").textContent = files.length ? `保存済み ${files.length}件` : "リモコンから追加してください"; }

function addMedia(rec){
  const old = files.find(f => f.name === rec.name);
  if (old) { URL.revokeObjectURL(old.url); files = files.filter(f => f !== old); if (cur === rec.name) cur = null; }
  const f = {name:rec.name, photo:rec.photo, url:URL.createObjectURL(rec.blob), w:16, h:9};
  files.push(f); files.sort((a, b) => a.name.localeCompare(b.name, "ja"));
  return new Promise(res => {
    if (f.photo) {
      const im = new Image();
      im.onload = () => { f.w = im.naturalWidth; f.h = im.naturalHeight; f.img = im; res(); };
      im.onerror = res; im.src = f.url; return;
    }
    const v = document.createElement("video"); v.muted = true; v.preload = "metadata";
    v.onloadedmetadata = () => { f.w = v.videoWidth; f.h = v.videoHeight; res(); };
    v.onerror = res; v.src = f.url;
  });
}
async function onData(m){
  if (!m) return;
  if (m.t === "play") {
    state = {name:m.name, playing:true};
    const f = curFile();
    if (f && !f.photo) { if (cur !== f.name) { cur = f.name; vid.src = f.url; } vid.currentTime = 0; }
    apply();
  }
  if (m.t === "stop") { state = {name:null, playing:false}; apply(); }
  if (m.t === "set") { settings[m.name] = def(m.s); store.set("holo-settings", settings); }
  if (m.t === "all") { Object.assign(settings, m.map); store.set("holo-settings", settings); }
  if (m.t === "begin") incoming = {name:String(m.name), type:String(m.type), photo:!!m.photo, parts:[]};
  if (m.t === "chunk" && incoming) incoming.parts.push(m.data);
  if (m.t === "end" && incoming) {
    const rec = {name:incoming.name, photo:incoming.photo, blob:new Blob(incoming.parts, {type:incoming.type})};
    incoming = null;
    try { await idb.put(rec); } catch(e){ send({t:"saved", ok:false}); return; }
    await addMedia(rec); showSaved(); sendList(); apply();
    send({t:"saved", ok:true});
  }
  if (m.t === "del") {
    const f = files.find(x => x.name === m.name);
    if (f) { URL.revokeObjectURL(f.url); files = files.filter(x => x !== f); }
    try { await idb.del(m.name); } catch(e){}
    if (state.name === m.name) state = {name:null, playing:false};
    if (cur === m.name) { vid.pause(); cur = null; }
    showSaved(); sendList(); apply();
  }
}
function sendList(){
  send({t:"list", screen:{w:innerWidth, h:innerHeight}, list:files.map(f => ({name:f.name, w:f.w, h:f.h, photo:f.photo}))});
}
function goFull(){
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fn) try { const r = fn.call(el, {navigationUI:"hide"}); r && r.catch && r.catch(() => {}); } catch(e){}
}
cv.addEventListener("click", goFull);
$("go").onclick = async () => {
  $("setup").classList.add("hidden"); running = true; goFull();
  try { lock = await navigator.wakeLock.request("screen"); } catch(e){}
  resize(); apply(); requestAnimationFrame(draw);
};
let tap = 0;
$("exit").onclick = () => {
  const n = Date.now();
  if (n - tap < 400) { running = false; vid.pause(); $("setup").classList.remove("hidden"); }
  tap = n;
};
document.addEventListener("visibilitychange", async () => {
  if (running && !document.hidden) { try { lock = await navigator.wakeLock.request("screen"); } catch(e){} apply(); }
});
function resize(){
  const d = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * d; cv.height = innerHeight * d;
}
addEventListener("resize", () => { resize(); if (role === "display") sendList(); });

const curFile = () => state.playing ? files.find(f => f.name === state.name) : null;
function apply(){
  if (!running) return;
  const f = curFile();
  if (!f || f.photo) { vid.pause(); return; }
  if (cur !== f.name) { cur = f.name; vid.src = f.url; }
  vid.play().catch(() => {});
}
function draw(){
  if (!running) return;
  requestAnimationFrame(draw);
  const W = cv.width, H = cv.height, m = Math.min(W, H);
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  const f = curFile();
  if (!f) return;
  const s = def(settings[f.name]), cx = W/2 + s.x*m, cy = H/2 + s.y*m;
  if (f.photo) {
    // 写真1枚を4つ、上辺が外側を向くように並べる(反射で正しい向きになるよう左右反転)
    if (!f.img) return;
    const k = Math.min(m*.28*s.scale/f.w, m*.28*s.scale/f.h), w = f.w*k, h = f.h*k;
    for (let i = 0; i < 4; i++) {
      ctx.setTransform(1,0,0,1,0,0);
      ctx.translate(cx, cy); ctx.rotate(i*Math.PI/2);
      ctx.translate(0, -(w/2 + s.gap*m) - h/2); ctx.scale(-1, 1);   // 間隔 = 重ならない最小距離 + 調整分
      ctx.drawImage(f.img, -w/2, -h/2, w, h);
    }
    return;
  }
  if (vid.readyState < 2 || !vid.videoWidth) return;
  const k = Math.min(m*s.scale/vid.videoWidth, m*s.scale/vid.videoHeight);
  const w = vid.videoWidth*k, h = vid.videoHeight*k;
  ctx.drawImage(vid, cx - w/2, cy - h/2, w, h);
}

/* ================= リモコン ================= */
let pending = null, sending = false, savedWait = null, openName = null;
function startRemote(){
  $("remote").classList.remove("hidden");
  render(); connect(); setInterval(connect, 3000);
}
function connect(){
  if (!peer || peer.disconnected || (conn && conn.open)) return;
  if (pending) pending.close();
  const c = pending = peer.connect(ROOM + "-display", {reliable:true});
  c.on("open", () => { pending = null; conn = c; send({t:"all", map:settings}); render(); });
  c.on("data", m => {
    if (!m) return;
    if (m.t === "saved" && savedWait) { savedWait(m.ok); savedWait = null; }
    if (m.t !== "list") return;
    list = (m.list || []).map(x => ({name:String(x.name), w:+x.w || 16, h:+x.h || 9, photo:!!x.photo}));
    if (m.screen) screen = {w:+m.screen.w || 390, h:+m.screen.h || 844};
    if (openName && !list.find(v => v.name === openName)) openName = null;
    render();
  });
  c.on("close", () => { if (conn === c) { conn = null; render(); } });
  c.on("error", () => {});
}
function play(name){ state = {name, playing:true}; send({t:"play", name}); render(); }
$("stop").onclick = () => { state = {name:null, playing:false}; send({t:"stop"}); render(); };

function render(){
  const on = !!(conn && conn.open);
  $("link").textContent = on ? "接続中" : "未接続";
  $("add").disabled = !on || sending;
  const L = $("list");
  $("panel").classList.add("hidden"); document.body.appendChild($("panel"));
  L.textContent = "";
  for (const v of list) {
    const row = document.createElement("div"); row.className = "item";
    const b = document.createElement("button"); b.className = "play";
    const playing = state.playing && state.name === v.name;
    b.textContent = (playing ? "▶ " : "") + v.name; b.classList.toggle("on", playing);
    b.onclick = () => play(v.name);
    const c = document.createElement("button"); c.className = "cfg";
    c.textContent = openName === v.name ? "閉じる" : "設定";
    c.onclick = () => { openName = openName === v.name ? null : v.name; if (openName) play(v.name); render(); };
    row.append(b, c); L.appendChild(row);
    if (openName === v.name) {
      L.appendChild($("panel")); $("panel").classList.remove("hidden");
      document.querySelectorAll(".photo").forEach(x => x.classList.toggle("hidden", !v.photo));
      sizePad();
    }
  }
  if (!list.length) { const p = document.createElement("div"); p.className = "msg"; p.textContent = on ? "まだありません。下の「＋ 追加」から入れてください" : "再生用を待っています"; L.appendChild(p); }
}

/* 追加: リモコンで選んだファイルを再生用スマホへ送って保存 */
$("add").onclick = () => $("files").click();
$("files").onchange = async () => {
  const fl = [...$("files").files]; $("files").value = "";
  if (!fl.length || sending) return;
  if (!(conn && conn.open)) { $("sendMsg").textContent = "再生用とつながっていません"; return; }
  sending = true; render();
  let done = 0;
  for (const f of fl) {
    const name = f.name.replace(/\.[^.]+$/, "");
    const ok = await sendFile(f, name, p => { $("sendMsg").textContent = `送信中 ${name} ${p}%`; });
    if (!ok) { $("sendMsg").textContent = `${name} を送れませんでした`; break; }
    done++;
  }
  if (done === fl.length) $("sendMsg").textContent = `${done}件 追加しました`;
  sending = false; render();
};
async function sendFile(file, name, progress){
  const c = conn, buf = await file.arrayBuffer(), CH = 64*1024;
  const photo = file.type.startsWith("image/");
  c.send({t:"begin", name, type:file.type || (photo ? "image/jpeg" : "video/mp4"), photo});
  for (let i = 0; i < buf.byteLength; i += CH) {
    if (!c.open) return false;
    while (c.dataChannel && c.dataChannel.bufferedAmount > 1024*1024) await new Promise(r => setTimeout(r, 30));
    c.send({t:"chunk", data:buf.slice(i, i + CH)});
    progress(Math.round(Math.min(100, (i + CH) / buf.byteLength * 100)));
  }
  const res = new Promise(r => { savedWait = r; setTimeout(() => { if (savedWait === r) { savedWait = null; r(false); } }, 60000); });
  c.send({t:"end"});
  return res;
}

/* 設定: 位置と大きさ */
const pad = $("pad"), pc = pad.getContext("2d");
let pw = 0, ph = 0;
function sizePad(){
  const ar = screen.w / screen.h;
  pw = Math.min($("panel").clientWidth - 26, innerHeight*0.45*ar); ph = pw / ar;
  const d = Math.min(devicePixelRatio || 1, 2);
  pad.style.width = pw + "px"; pad.style.height = ph + "px";
  pad.width = pw*d; pad.height = ph*d; drawPad();
}
addEventListener("resize", () => role === "remote" && openName && sizePad());
function drawPad(){
  if (!openName) return;
  const W = pad.width, H = pad.height, m = Math.min(W, H);
  const s = def(settings[openName]), v = list.find(x => x.name === openName) || {w:16, h:9};
  pc.setTransform(1,0,0,1,0,0); pc.fillStyle = "#000"; pc.fillRect(0, 0, W, H);
  const box = (x, y, w, h) => {
    pc.fillStyle = "rgba(255,255,255,.15)"; pc.fillRect(x, y, w, h);
    pc.strokeStyle = "#fff"; pc.lineWidth = 2; pc.strokeRect(x, y, w, h);
  };
  const cx = W/2 + s.x*m, cy = H/2 + s.y*m;
  if (v.photo) {
    const k = Math.min(m*.28*s.scale/v.w, m*.28*s.scale/v.h), w = v.w*k, h = v.h*k;
    for (let i = 0; i < 4; i++) {
      pc.setTransform(1,0,0,1,0,0); pc.translate(cx, cy); pc.rotate(i*Math.PI/2);
      box(-w/2, -(w/2 + s.gap*m) - h, w, h);
    }
    pc.setTransform(1,0,0,1,0,0);
  } else {
    const k = Math.min(m*s.scale/v.w, m*s.scale/v.h), w = v.w*k, h = v.h*k;
    box(cx - w/2, cy - h/2, w, h);
  }
  $("size").textContent = Math.round(s.scale*100) + "%";
}
function update(s){
  settings[openName] = s; drawPad();
  send({t:"set", name:openName, s});
  clearTimeout(update.t); update.t = setTimeout(() => store.set("holo-settings", settings), 400);
}
const edit = fn => { if (!openName) return; const s = def(settings[openName]); fn(s); update(s); };
$("zIn").onclick  = () => edit(s => s.scale = clamp(s.scale * 1.05, .15, 3));
$("zOut").onclick = () => edit(s => s.scale = clamp(s.scale / 1.05, .15, 3));
$("gIn").onclick  = () => edit(s => s.gap = clamp(s.gap - .01, -.1, .4));
$("gOut").onclick = () => edit(s => s.gap = clamp(s.gap + .01, 0, .4));
$("reset").onclick = () => edit(s => Object.assign(s, DEF));
$("del").onclick = () => {
  if (!openName || !confirm(`「${openName}」を削除しますか？`)) return;
  send({t:"del", name:openName});
  if (state.name === openName) state = {name:null, playing:false};
  openName = null; render();
};
// パソコン: ホイールで大きさ
pad.addEventListener("wheel", e => {
  e.preventDefault();
  edit(s => s.scale = clamp(s.scale * Math.exp(-e.deltaY * 0.0015), .15, 3));
}, {passive:false});
// ドラッグで移動、2本指で大きさ
const pts = new Map(); let g = null;
function begin(){
  const p = [...pts.values()];
  g = {s:def(settings[openName]), p:p.map(o => ({...o}))};
  if (p.length > 1) { g.d = Math.hypot(p[1].x-p[0].x, p[1].y-p[0].y) || 1; g.m = {x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2}; }
}
pad.addEventListener("pointerdown", e => { pad.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); begin(); });
pad.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId) || !g) return;
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const p = [...pts.values()], M = Math.min(pw, ph), s = Object.assign({}, g.s);
  if (p.length === 1) {
    s.x = clamp(g.s.x + (p[0].x - g.p[0].x)/M, -.7, .7);
    s.y = clamp(g.s.y + (p[0].y - g.p[0].y)/M, -.7, .7);
  } else {
    const d = Math.hypot(p[1].x-p[0].x, p[1].y-p[0].y), mid = {x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2};
    s.scale = clamp(g.s.scale * d/g.d, .15, 3);
    s.x = clamp(g.s.x + (mid.x - g.m.x)/M, -.7, .7);
    s.y = clamp(g.s.y + (mid.y - g.m.y)/M, -.7, .7);
  }
  update(s);
});
const end = e => { pts.delete(e.pointerId); pts.size ? begin() : (g = null); };
pad.addEventListener("pointerup", end);
pad.addEventListener("pointercancel", end);
})();
</script>
