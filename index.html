<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ホログラム</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ホログラム">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#fff; --ink:#111; --sub:#777; --line:#ddd; --red:#d92d20;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#000; --ink:#eee; --sub:#888; --line:#333; } }
:root[data-theme="dark"]{ --bg:#000; --ink:#eee; --sub:#888; --line:#333; }
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; font-size:16px; line-height:1.5;
  -webkit-tap-highlight-color:transparent}
button, input{font:inherit; color:inherit}
button{background:none; border:1px solid var(--line); border-radius:6px; padding:12px; cursor:pointer}
button.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
button:disabled{opacity:.4}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.hidden{display:none !important}
.wrap{max-width:480px; margin:0 auto; padding:20px 16px}
h1{font-size:1.2rem; margin:0 0 20px}
.msg{color:var(--sub); font-size:.9rem; min-height:1.5em; margin-top:10px}

#start button{display:block; width:100%; margin-bottom:10px; text-align:left}

/* 再生用 */
#display{position:fixed; inset:0; background:#000; z-index:10; overflow:hidden}
#stage{position:absolute; inset:0}
#vid, #photo img{position:absolute; display:block; transform-origin:50% 50%; visibility:hidden}
#vid{object-fit:fill}
#back{position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); left:12px; z-index:2;
  border-color:#444; color:#ccc; background:#000; padding:8px 14px}
#setup{position:absolute; inset:0; z-index:3; background:#000; display:flex; flex-direction:column; justify-content:center; gap:10px; padding:24px; max-width:420px; margin:0 auto}
#setup button{border-color:#444; color:#eee}
#setup .msg{color:#777}

/* リモコン */
#remote{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px}
.head h1{margin:0}
.head span{font-size:.85rem; color:var(--sub)}
.head button{padding:6px 12px; font-size:.85rem; margin-left:6px}
.item{display:flex; gap:6px; margin-bottom:6px}
.item .play{flex:1; min-width:0; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item .cfg{flex:none; width:5em; font-size:.85rem; padding:12px 0}
#add{width:100%; border-style:dashed; color:var(--sub); margin-top:6px}
.panel{border:1px solid var(--line); border-radius:6px; padding:12px; margin:0 0 10px}
.panel label{display:block; font-size:.85rem; color:var(--sub); margin-bottom:4px}
#name{width:100%; border:1px solid var(--line); border-radius:6px; padding:10px; background:transparent; margin-bottom:12px}
#pad{display:block; margin:0 auto; background:#000; border-radius:4px; touch-action:none; cursor:grab}
.tools{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.tools button{padding:8px 12px; font-size:.9rem}
.tools .sp{flex:1}
.tools span{align-self:center; font-size:.85rem; color:var(--sub); min-width:3.5em}
.hint{font-size:.8rem; color:var(--sub); margin-top:8px}
#stop{position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); max-width:448px; margin:0 auto;
  background:var(--red); color:#fff; border:0; border-radius:10px; padding:16px; font-size:1.1rem; font-weight:700}
</style>
</head>
<body>

<div id="start" class="wrap">
  <h1>ホログラム</h1>
  <button id="bDisplay">再生用</button>
  <button id="bRemote">リモコン</button>
  <div class="msg" id="startMsg"></div>
</div>

<div id="display" class="hidden">
  <div id="stage">
    <video id="vid" muted playsinline webkit-playsinline loop preload="auto"></video>
    <div id="photo"><img alt=""><img alt=""><img alt=""><img alt=""></div>
  </div>
  <button id="back" class="hidden">戻る</button>
  <div id="setup">
    <button id="go">開始</button>
    <button id="setupBack">戻る</button>
    <div class="msg" id="dStatus"></div>
  </div>
</div>

<div id="remote" class="wrap hidden">
  <div class="head"><h1>リモコン</h1><span><span id="link"></span><button id="rBack">戻る</button></span></div>
  <div id="list"></div>
  <input type="file" id="files" accept="video/*,image/*" multiple class="hidden">
  <button id="add">＋ 追加</button>
  <div class="msg" id="sendMsg"></div>
  <button id="stop">停止</button>
</div>

<div id="panel" class="panel hidden">
  <label for="name">名前</label>
  <input id="name" maxlength="40" autocomplete="off">
  <canvas id="pad"></canvas>
  <div class="tools">
    <button id="zOut" aria-label="小さく">－</button>
    <span id="size"></span>
    <button id="zIn" aria-label="大きく">＋</button>
    <button id="gIn" class="photo">間隔 −</button>
    <button id="gOut" class="photo">間隔 ＋</button>
    <span class="sp"></span>
    <button id="reset">リセット</button>
    <button id="del">削除</button>
  </div>
  <div class="hint">ドラッグで移動。スマホは2本指、パソコンはホイールでも大きさを変えられます。</div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const ROOM = "holo-q7x2m9k4t8";   // 部屋名(固定)。リモコンだけがこの名前を使い、1台に限られる
const ICE = {config:{iceServers:[{urls:"stun:stun.l.google.com:19302"}]}};
const DEF = {scale:1, x:0, y:0, gap:0.02};
const def = s => Object.assign({}, DEF, s || {});
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
// 端末内の保存場所(IndexedDB)
function makeIdb(dbName){
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open(dbName, 1);
    r.onupgradeneeded = () => r.result.createObjectStore("media", {keyPath:"id"});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("media", mode), out = fn(t.objectStore("media"));
      t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
    });
  };
  return {
    all: () => tx("readonly", s => s.getAll()),
    get: id => tx("readonly", s => s.get(id)),
    put: rec => tx("readwrite", s => s.put(rec)),
    del: id => tx("readwrite", s => s.delete(id))
  };
}
const mediaSize = (blob, photo) => new Promise(res => {
  const url = URL.createObjectURL(blob), done = (w, h, bad) => { URL.revokeObjectURL(url); res({w, h, bad}); };
  if (photo) { const im = new Image(); im.onload = () => done(im.naturalWidth, im.naturalHeight, false); im.onerror = () => done(16, 9, true); im.src = url; return; }
  const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.preload = "metadata";
  v.onloadedmetadata = () => done(v.videoWidth || 16, v.videoHeight || 9, false);
  v.onerror = () => done(16, 9, true); v.src = url;
});

let peer = null, role = null, timers = [];

/* ---------- start ---------- */
function enter(r){
  if (typeof Peer === "undefined") { $("startMsg").textContent = "ネットにつながっていません"; return; }
  $("bDisplay").disabled = $("bRemote").disabled = true;
  $("startMsg").textContent = "";
  let ok = false;
  // リモコンは固定の名前(1台だけ)、再生用は毎回ちがう名前(何台でも)
  const p = r === "remote" ? new Peer(ROOM + "-remote", ICE) : new Peer(ICE);
  p.on("open", () => {
    ok = true; peer = p; role = r;
    $("bDisplay").disabled = $("bRemote").disabled = false;
    $("start").classList.add("hidden");
    r === "display" ? startDisplay() : startRemote();
  });
  p.on("error", e => {
    if (ok) return;
    $("bDisplay").disabled = $("bRemote").disabled = false; p.destroy();
    $("startMsg").textContent = e.type === "unavailable-id" ? "リモコンはもう別の端末が使っています" : "接続できませんでした";
  });
  p.on("disconnected", () => { if (peer === p) setTimeout(() => { try { p.reconnect(); } catch(e){} }, 1500); });
}
$("bDisplay").onclick = () => enter("display");
$("bRemote").onclick = () => enter("remote");
addEventListener("pagehide", () => peer && peer.destroy());

function leave(){
  timers.forEach(clearInterval); timers = [];
  if (role === "display") stopDisplay(); else stopRemote();
  if (peer) peer.destroy();
  peer = null; role = null;
  $("display").classList.add("hidden"); $("remote").classList.add("hidden");
  $("start").classList.remove("hidden");
}

/* ================= 再生用(何台でも) ================= */
const dIdb = makeIdb("holo-display");
const vid = $("vid"), imgs = [...document.querySelectorAll("#photo img")];
let dConn = null, dPending = null, files = new Map();   // id -> {id, photo, url, w, h, bad}
let dSettings = {}, dState = {id:null, playing:false}, running = false, curVid = null, lock = null, incoming = null, unlocked = false;

async function startDisplay(){
  $("display").classList.remove("hidden"); $("setup").classList.remove("hidden");
  for (const f of files.values()) URL.revokeObjectURL(f.url);
  files.clear();
  try { for (const rec of await dIdb.all()) await addFile(rec); } catch(e){}
  dStatus(); dConnect(); timers.push(setInterval(dConnect, 3000));
}
function stopDisplay(){
  running = false; vid.pause(); vid.removeAttribute("src"); vid.load(); curVid = null;
  if (dConn) try { dConn.close(); } catch(e){}
  dConn = null;
  try { document.fullscreenElement && document.exitFullscreen(); } catch(e){}
  try { lock && lock.release(); } catch(e){} lock = null;
}
function dStatus(){
  const on = dConn && dConn.open;
  $("dStatus").textContent = (on ? "リモコンと接続中" : "リモコンを待っています") + `　保存済み ${files.size}件`;
}
async function addFile(rec){
  const old = files.get(rec.id); if (old) URL.revokeObjectURL(old.url);
  const size = await mediaSize(rec.blob, rec.photo);
  files.set(rec.id, {id:rec.id, photo:rec.photo, url:URL.createObjectURL(rec.blob), w:size.w, h:size.h, bad:size.bad});
  if (curVid === rec.id) curVid = null;
}
async function dropFile(id){
  const f = files.get(id); if (f) URL.revokeObjectURL(f.url);
  files.delete(id); try { await dIdb.del(id); } catch(e){}
  if (curVid === id) { vid.pause(); curVid = null; }
}
// 再生用からリモコンにつなぎにいく(リモコンがあとから来ても、再生用が途中から入ってもつながる)
function dConnect(){
  if (!peer || peer.disconnected || (dConn && dConn.open)) return;
  if (dPending) try { dPending.close(); } catch(e){}
  const c = dPending = peer.connect(ROOM + "-remote", {reliable:true});
  c.on("open", () => {
    dPending = null; dConn = c; dStatus();
    c.send({t:"hello", have:[...files.keys()], screen:{w:innerWidth, h:innerHeight}});
  });
  c.on("data", onDisplayData);
  c.on("close", () => { if (dConn === c) { dConn = null; dStatus(); } });
  c.on("error", () => {});
}
async function onDisplayData(m){
  if (!m) return;
  if (m.t === "sync") {             // つないだ直後: 一覧・設定・いま再生中のもの
    const keep = new Set(m.ids || []);
    for (const id of [...files.keys()]) if (!keep.has(id)) await dropFile(id);
    dSettings = m.settings || {}; dState = m.state || {id:null, playing:false};
    dStatus(); apply(true);
  }
  if (m.t === "play") { dState = {id:m.id, playing:true}; apply(true); }
  if (m.t === "stop") { dState = {id:null, playing:false}; apply(); }
  if (m.t === "set") { dSettings[m.id] = def(m.s); layout(); }
  if (m.t === "del") { await dropFile(m.id); dStatus(); apply(); }
  if (m.t === "begin") incoming = {id:String(m.id), type:String(m.type), photo:!!m.photo, parts:[]};
  if (m.t === "chunk" && incoming) incoming.parts.push(m.data);
  if (m.t === "end" && incoming) {
    const rec = {id:incoming.id, photo:incoming.photo, blob:new Blob(incoming.parts, {type:incoming.type})};
    incoming = null;
    let ok = true;
    try { await dIdb.put(rec); } catch(e){ ok = false; }
    await addFile(rec);
    if (dConn) dConn.send({t:"saved", id:rec.id, ok, bad:files.get(rec.id).bad});
    dStatus(); apply(dState.id === rec.id);
  }
}
function goFull(){
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fn) try { const r = fn.call(el, {navigationUI:"hide"}); r && r.catch && r.catch(() => {}); } catch(e){}
}
$("go").onclick = async () => {
  // タップの操作中に一度再生しておくと、あとでリモコンから再生できる(iPhoneの省電力モード対策)
  const first = [...files.values()].find(f => !f.photo && !f.bad);
  if (first && !unlocked) {
    curVid = first.id; vid.src = first.url;
    const p = vid.play();
    if (p) p.then(() => { unlocked = true; apply(); }).catch(() => {});
  }
  $("setup").classList.add("hidden"); running = true; goFull();
  try { lock = await navigator.wakeLock.request("screen"); } catch(e){}
  apply();
};
$("setupBack").onclick = leave;
let backTimer = 0;
$("stage").addEventListener("click", () => {
  goFull();
  $("back").classList.remove("hidden");
  clearTimeout(backTimer); backTimer = setTimeout(() => $("back").classList.add("hidden"), 3000);
});
$("back").onclick = () => {
  $("back").classList.add("hidden");
  running = false; vid.pause(); layout();
  $("setup").classList.remove("hidden");
};
document.addEventListener("visibilitychange", async () => {
  if (role === "display" && running && !document.hidden) { try { lock = await navigator.wakeLock.request("screen"); } catch(e){} apply(); }
});
addEventListener("resize", () => {
  if (role !== "display") return;
  layout();
  if (dConn && dConn.open) dConn.send({t:"screen", screen:{w:innerWidth, h:innerHeight}});
});

const curFile = () => (running && dState.playing) ? files.get(dState.id) || null : null;
function apply(restart){
  const f = curFile();
  if (!f || f.photo) { if (unlocked || !running) vid.pause(); layout(); return; }
  if (curVid !== f.id) { curVid = f.id; vid.src = f.url; }
  else if (restart) { try { vid.currentTime = 0; } catch(e){} }
  vid.play().catch(() => {});
  layout();
}
vid.addEventListener("loadedmetadata", () => layout());
function layout(){
  const W = innerWidth, H = innerHeight, m = Math.min(W, H), f = curFile();
  vid.style.visibility = (f && !f.photo) ? "visible" : "hidden";
  imgs.forEach(im => im.style.visibility = (f && f.photo) ? "visible" : "hidden");
  if (!f) return;
  const s = def(dSettings[f.id]), cx = W/2 + s.x*m, cy = H/2 + s.y*m;
  if (f.photo) {
    // 写真1枚を4つ、上辺が外側を向くように並べる(反射で正しい向きになるよう左右反転)
    const k = Math.min(m*.28*s.scale/f.w, m*.28*s.scale/f.h), w = f.w*k, h = f.h*k, d = w/2 + s.gap*m + h/2;
    imgs.forEach((im, i) => {
      if (im.getAttribute("src") !== f.url) im.src = f.url;
      Object.assign(im.style, {width:w+"px", height:h+"px", left:(cx - w/2)+"px", top:(cy - h/2)+"px",
        transform:`rotate(${i*90}deg) translateY(${-d}px) scaleX(-1)`});
    });
    return;
  }
  const vw = vid.videoWidth || f.w, vh = vid.videoHeight || f.h;
  const k = Math.min(m*s.scale/vw, m*s.scale/vh), w = vw*k, h = vh*k;
  Object.assign(vid.style, {width:w+"px", height:h+"px", left:(cx - w/2)+"px", top:(cy - h/2)+"px"});
}

/* ================= リモコン(1台) ================= */
// 動画・写真の本体はリモコンに保存し、つながった再生用へ配る
const rIdb = makeIdb("holo-remote");
let items = [];                                   // [{id, name, photo, type, w, h, order}]
let settings = store.get("holo-r-settings", {});  // id -> {scale,x,y,gap}
let state = store.get("holo-r-state", {id:null, playing:false});
let conns = new Set(), screen = {w:390, h:844}, openId = null, badIds = new Set();
const bcast = m => conns.forEach(c => { if (c.open) try { c.send(m); } catch(e){} });

async function startRemote(){
  $("remote").classList.remove("hidden"); $("sendMsg").textContent = ""; openId = null;
  try { items = (await rIdb.all()).map(({blob, ...meta}) => meta).sort((a, b) => a.order - b.order); } catch(e){ items = []; }
  render();
  peer.on("connection", c => {
    c.q = Promise.resolve();
    c.on("open", () => { conns.add(c); render(); });
    c.on("data", m => onRemoteData(c, m));
    c.on("close", () => { conns.delete(c); render(); });
    c.on("error", () => {});
  });
}
function stopRemote(){ conns.forEach(c => { try { c.close(); } catch(e){} }); conns.clear(); }

const acks = new Map();   // "connId:itemId" -> resolve
function onRemoteData(c, m){
  if (!m) return;
  if (m.t === "hello") {
    if (m.screen) screen = {w:+m.screen.w || 390, h:+m.screen.h || 844};
    const have = new Set(m.have || []);
    c.send({t:"sync", ids:items.map(i => i.id), settings, state});
    for (const it of items) if (!have.has(it.id)) queueSend(c, it);
    render();
  }
  if (m.t === "screen" && m.screen) { screen = {w:+m.screen.w || 390, h:+m.screen.h || 844}; if (openId) sizePad(); }
  if (m.t === "saved") {
    if (m.bad) badIds.add(m.id);
    const k = c.connectionId + ":" + m.id, r = acks.get(k);
    if (r) { acks.delete(k); r(m.ok); }
  }
}
// 1台の再生用へ、1件ずつ順番に送る
function queueSend(c, it){
  c.q = c.q.then(async () => {
    if (!c.open) return;
    const rec = await rIdb.get(it.id); if (!rec) return;
    const buf = await rec.blob.arrayBuffer(), CH = 64*1024;
    c.send({t:"begin", id:it.id, type:rec.type, photo:rec.photo});
    for (let i = 0; i < buf.byteLength; i += CH) {
      if (!c.open) return;
      while (c.dataChannel && c.dataChannel.bufferedAmount > 1024*1024) await new Promise(r => setTimeout(r, 30));
      c.send({t:"chunk", data:buf.slice(i, i + CH)});
      progress(it, Math.round(Math.min(100, (i + CH) / buf.byteLength * 100)));
    }
    const ok = await new Promise(r => {
      acks.set(c.connectionId + ":" + it.id, r);
      setTimeout(() => { if (acks.delete(c.connectionId + ":" + it.id)) r(false); }, 60000);
      c.send({t:"end"});
    });
    progress(it, ok ? "done" : "fail");
  }).catch(() => {});
}
let sendingCount = 0;
function progress(it, p){
  if (p === "done" || p === "fail") {
    $("sendMsg").textContent = p === "fail" ? `「${it.name}」を送れませんでした`
      : badIds.has(it.id) ? `「${it.name}」は再生用の端末で再生できない形式です(mp4で入れ直してください)` : `「${it.name}」を再生用に送りました`;
    render(); return;
  }
  $("sendMsg").textContent = `再生用へ送信中「${it.name}」${p}%`;
}

function setState(s){ state = s; store.set("holo-r-state", state); render(); }
function play(id){ setState({id, playing:true}); bcast({t:"play", id}); }
$("stop").onclick = () => { setState({id:null, playing:false}); bcast({t:"stop"}); };
$("rBack").onclick = leave;

function render(){
  $("link").textContent = conns.size ? `再生用 ${conns.size}台` : "再生用なし";
  const L = $("list");
  $("panel").classList.add("hidden"); document.body.appendChild($("panel"));
  L.textContent = "";
  for (const it of items) {
    const row = document.createElement("div"); row.className = "item";
    const b = document.createElement("button"); b.className = "play";
    const playing = state.playing && state.id === it.id;
    b.textContent = (playing ? "▶ " : "") + it.name + (badIds.has(it.id) ? "(再生できない形式)" : "");
    b.classList.toggle("on", playing);
    b.onclick = () => play(it.id);
    const c = document.createElement("button"); c.className = "cfg";
    c.textContent = openId === it.id ? "閉じる" : "設定";
    c.onclick = () => { openId = openId === it.id ? null : it.id; if (openId) play(it.id); else render(); };
    row.append(b, c); L.appendChild(row);
    if (openId === it.id) {
      L.appendChild($("panel")); $("panel").classList.remove("hidden");
      if (document.activeElement !== $("name")) $("name").value = it.name;
      document.querySelectorAll(".photo").forEach(x => x.classList.toggle("hidden", !it.photo));
      sizePad();
    }
  }
  if (!items.length) { const p = document.createElement("div"); p.className = "msg"; p.textContent = "まだありません。下の「＋ 追加」から入れてください"; L.appendChild(p); }
}

/* 追加: リモコンに保存してから、つながっている再生用すべてへ送る */
$("add").onclick = () => $("files").click();
$("files").onchange = async () => {
  const fl = [...$("files").files]; $("files").value = "";
  for (const f of fl) {
    const photo = f.type.startsWith("image/");
    const type = f.type || (photo ? "image/jpeg" : "video/mp4");
    const size = await mediaSize(f, photo);
    const it = {id:Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
                name:f.name.replace(/\.[^.]+$/, "").slice(0, 40), photo, type, w:size.w, h:size.h, order:Date.now()};
    try { await rIdb.put(Object.assign({blob:new Blob([await f.arrayBuffer()], {type})}, it)); }
    catch(e){ $("sendMsg").textContent = `「${it.name}」を保存できませんでした`; continue; }
    items.push(it);
    conns.forEach(c => queueSend(c, it));
  }
  $("sendMsg").textContent = conns.size ? $("sendMsg").textContent : `${fl.length}件 追加しました。再生用がつながると自動で送られます`;
  // 追加したものは、すぐ名前を付けられるように設定を開く
  if (fl.length) { openId = items[items.length - 1].id; render(); $("name").focus(); $("name").select(); }
};

/* 名前 */
let nameTimer = 0;
$("name").addEventListener("input", () => {
  const it = items.find(x => x.id === openId); if (!it) return;
  it.name = $("name").value.trim().slice(0, 40) || "無題";
  const btn = [...document.querySelectorAll(".item")].find(r => r.nextSibling === $("panel"));
  if (btn) btn.querySelector(".play").textContent = (state.playing && state.id === it.id ? "▶ " : "") + it.name;
  clearTimeout(nameTimer);
  nameTimer = setTimeout(async () => { try { const rec = await rIdb.get(it.id); if (rec) { rec.name = it.name; await rIdb.put(rec); } } catch(e){} }, 500);
});
$("name").addEventListener("keydown", e => { if (e.key === "Enter") $("name").blur(); });

/* 設定: 位置と大きさ */
const pad = $("pad"), pc = pad.getContext("2d");
let pw = 0, ph = 0;
function sizePad(){
  const ar = screen.w / screen.h;
  pw = Math.min($("panel").clientWidth - 26, innerHeight*0.45*ar); ph = pw / ar;
  const d = Math.min(devicePixelRatio || 1, 2);
  pad.style.width = pw + "px"; pad.style.height = ph + "px";
  pad.width = pw*d; pad.height = ph*d; drawPad();
}
addEventListener("resize", () => role === "remote" && openId && sizePad());
function drawPad(){
  const it = items.find(x => x.id === openId); if (!it) return;
  const W = pad.width, H = pad.height, m = Math.min(W, H), s = def(settings[it.id]);
  pc.setTransform(1,0,0,1,0,0); pc.fillStyle = "#000"; pc.fillRect(0, 0, W, H);
  const box = (x, y, w, h) => {
    pc.fillStyle = "rgba(255,255,255,.15)"; pc.fillRect(x, y, w, h);
    pc.strokeStyle = "#fff"; pc.lineWidth = 2; pc.strokeRect(x, y, w, h);
  };
  const cx = W/2 + s.x*m, cy = H/2 + s.y*m;
  if (it.photo) {
    const k = Math.min(m*.28*s.scale/it.w, m*.28*s.scale/it.h), w = it.w*k, h = it.h*k;
    for (let i = 0; i < 4; i++) {
      pc.setTransform(1,0,0,1,0,0); pc.translate(cx, cy); pc.rotate(i*Math.PI/2);
      box(-w/2, -(w/2 + s.gap*m) - h, w, h);
    }
    pc.setTransform(1,0,0,1,0,0);
  } else {
    const k = Math.min(m*s.scale/it.w, m*s.scale/it.h), w = it.w*k, h = it.h*k;
    box(cx - w/2, cy - h/2, w, h);
  }
  $("size").textContent = Math.round(s.scale*100) + "%";
}
function update(s){
  settings[openId] = s; drawPad();
  bcast({t:"set", id:openId, s});
  clearTimeout(update.t); update.t = setTimeout(() => store.set("holo-r-settings", settings), 400);
}
const edit = fn => { if (!openId) return; const s = def(settings[openId]); fn(s); update(s); };
$("zIn").onclick  = () => edit(s => s.scale = clamp(s.scale * 1.05, .15, 3));
$("zOut").onclick = () => edit(s => s.scale = clamp(s.scale / 1.05, .15, 3));
$("gIn").onclick  = () => edit(s => s.gap = clamp(s.gap - .01, -.1, .4));
$("gOut").onclick = () => edit(s => s.gap = clamp(s.gap + .01, -.1, .4));
$("reset").onclick = () => edit(s => Object.assign(s, DEF));
$("del").onclick = async () => {
  const it = items.find(x => x.id === openId);
  if (!it || !confirm(`「${it.name}」を削除しますか？`)) return;
  items = items.filter(x => x !== it); delete settings[it.id]; store.set("holo-r-settings", settings);
  try { await rIdb.del(it.id); } catch(e){}
  bcast({t:"del", id:it.id});
  if (state.id === it.id) setState({id:null, playing:false});
  openId = null; render();
};
pad.addEventListener("wheel", e => {
  e.preventDefault();
  edit(s => s.scale = clamp(s.scale * Math.exp(-e.deltaY * 0.0015), .15, 3));
}, {passive:false});
const pts = new Map(); let g = null;
function begin(){
  const p = [...pts.values()];
  g = {s:def(settings[openId]), p:p.map(o => ({...o}))};
  if (p.length > 1) { g.d = Math.hypot(p[1].x-p[0].x, p[1].y-p[0].y) || 1; g.m = {x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2}; }
}
pad.addEventListener("pointerdown", e => { pad.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); begin(); });
pad.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId) || !g) return;
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const p = [...pts.values()], M = Math.min(pw, ph), s = Object.assign({}, g.s);
  if (p.length === 1) {
    s.x = clamp(g.s.x + (p[0].x - g.p[0].x)/M, -.7, .7);
    s.y = clamp(g.s.y + (p[0].y - g.p[0].y)/M, -.7, .7);
  } else {
    const d = Math.hypot(p[1].x-p[0].x, p[1].y-p[0].y), mid = {x:(p[0].x+p[1].x)/2, y:(p[0].y+p[1].y)/2};
    s.scale = clamp(g.s.scale * d/g.d, .15, 3);
    s.x = clamp(g.s.x + (mid.x - g.m.x)/M, -.7, .7);
    s.y = clamp(g.s.y + (mid.y - g.m.y)/M, -.7, .7);
  }
  update(s);
});
const end = e => { pts.delete(e.pointerId); pts.size ? begin() : (g = null); };
pad.addEventListener("pointerup", end);
pad.addEventListener("pointercancel", end);
})();
</script>
</body>
